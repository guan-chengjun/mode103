<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交互式 3D 沙漏</title>
  <style>
    /* 全局样式：画布铺满窗口，UI 面板悬浮在左上角 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #101014; }
    #app { width: 100%; height: 100%; }
    #app canvas { display: block; }

    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(20, 20, 28, 0.72);
      backdrop-filter: blur(8px);
      color: #e8e4da;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      font-size: 14px;
      user-select: none;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }
    #panel .row { display: flex; align-items: center; gap: 10px; }
    #panel button {
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #panel button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
    #panel button:disabled { opacity: 0.45; cursor: not-allowed; }
    #panel input[type="range"] { width: 140px; accent-color: #f0c060; }
    #model-status { font-size: 12px; opacity: 0.75; }
    #model-status.ok { color: #9fd68a; }
    #model-status.err { color: #e89a8a; }
    #hint {
      position: fixed;
      right: 16px;
      bottom: 12px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.45);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 3D 画布挂载点 -->
  <div id="app"></div>
  <!-- 控制面板与提示由 ControlPanel 动态填充 -->
  <div id="panel"></div>
  <div id="hint">拖动旋转视角 · 滚轮缩放</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
